name: Enriquecer datos
on:
  schedule:
    - cron: "30 4 * * 1"   # lunes 04:30 UTC
  workflow_dispatch:
    inputs:
      all:
        description: "Revisar también fotos que ya existen"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [data/places.json]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: enriquecer
  cancel-in-progress: false
jobs:
  photos:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Áreas de autocaravanas de OpenStreetMap
        continue-on-error: true
        run: python scripts/fetch_areas.py
      - name: Afinar coordenadas aproximadas
        continue-on-error: true
        run: python scripts/geocode_aprox.py
      - name: Buscar og:image en las fuentes
        run: python scripts/fetch_photos.py ${{ inputs.all && '--all' || '' }}
      - name: Guardar cambios
        id: commit
        run: |
          git add -A data/
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Enriquecer datos: áreas OSM, coordenadas y fotos"
          git pull --rebase && git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # Los pushes hechos con GITHUB_TOKEN no disparan otros workflows: publicamos aquí.
      - name: Preparar sitio
        if: steps.commit.outputs.changed == 'true'
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest assets data _site/
          touch _site/.nojekyll
      - if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - if: steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
